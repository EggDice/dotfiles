# kitty configuration — mirrors the previous Hyper look & feel.
# See https://sw.kovidgoyal.net/kitty/conf/ for all options.

# --- Font -------------------------------------------------------------------
font_family      Monaspace Krypton
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0
# Hyper had disableLigatures: true
disable_ligatures always

# --- Cursor -----------------------------------------------------------------
# Hyper: cursorShape BLOCK, cursorColor rgba(248,28,229,0.8), no blink
cursor_shape          block
cursor                #f81ce5
cursor_text_color     #000000
cursor_blink_interval 0

# --- Colors -----------------------------------------------------------------
foreground #ffffff
background #000000

# Hyper selectionColor rgba(248,28,229,0.3) over black
selection_foreground none
selection_background  #4a0844

# 16-color palette (from hyper.js `colors`).
# kitty 0.48 has no bold_is_bright, and Hyper drew bold text in the bright
# palette. To mirror that, the chromatic base colors (1-6) use Hyper's bright
# values, matching colors 9-14 below. Black (0) and white (7) are left intact.
color0  #000000
color1  #ff5f5f
color2  #5fff5f
color3  #ffffaf
color4  #5fafff
color5  #ff5fff
color6  #5fffff
color7  #ffffff
color8  #808080
color9  #ff5f5f
color10 #5fff5f
color11 #ffffaf
color12 #5fafff
color13 #ff5fff
color14 #5fffff
color15 #e4e4e4

# --- Window / chrome --------------------------------------------------------
# Hyper: showWindowControls false + hyperclean hideTabs → clean, chromeless look
# `yes` also hides the macOS traffic-light buttons
hide_window_decorations yes
tab_bar_style           hidden
# No padding around the terminal content, except a little at the bottom
# (~0.5rem at 12pt). Order is: top right bottom left
window_padding_width 0 0 6 0

# 1px grey border around the window, brighter when focused (Hyper borderColor was #333)
draw_minimal_borders                    no
draw_window_borders_for_single_window   yes
window_border_width                     1px
active_border_color                     #666666
inactive_border_color                   #333333

# --- Behaviour --------------------------------------------------------------
# Hyper copyOnSelect: true
copy_on_select yes
# Hyper scrollback: 100000
scrollback_lines 100000
# Hyper bell: false
enable_audio_bell no

# macOS: keep left Option usable as Meta/Alt in the shell (Hyper default)
macos_option_as_alt no
